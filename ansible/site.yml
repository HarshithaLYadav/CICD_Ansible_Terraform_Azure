---
- name: Deploy DevOps Application
  hosts: webservers
  become: yes

  vars:
    app_name: devops-e2e-app

  tasks:

    - name: Install Java
      apt:
        name: openjdk-8-jdk
        state: present
        update_cache: yes

    - name: Create Tomcat user
      user:
        name: tomcat
        system: yes
        shell: /usr/sbin/nologin
        home: /opt/tomcat
      ignore_errors: yes

    - name: Copy Tomcat systemd service
      copy:
        src: files/tomcat.service
        dest: /etc/systemd/system/tomcat.service
        owner: root
        group: root
        mode: '0644'

    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Enable Tomcat service
      systemd:
        name: tomcat
        enabled: yes

    - name: Copy WAR file
      copy:
        src: ../target/devops-e2e-app.war
        dest: /opt/tomcat/latest/webapps/devops-e2e-app.war
        owner: tomcat
        group: tomcat
        mode: '0644'

    - name: Restart Tomcat
      systemd:
        name: tomcat
        state: restarted

    - name: Wait for Tomcat
      wait_for:
        port: 8080
        delay: 10
        timeout: 60

    - name: Verify application
      uri:
        url: http://localhost:8080/devops-e2e-app/hello
        status_code: 200







































